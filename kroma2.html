<script>
(()=>{'use strict';
const $=x=>document.getElementById(x), canvas=$('scene'), ctx=canvas.getContext('2d'), view=$('playarea');
const facts=[
 {id:'minerva',short:'LA MINERVA',name:'La Minerva de Guadalajara',kind:'Historia y arte',fact:'La escultura de La Minerva es obra de Joaquín Arias. El monumento fue inaugurado en 1956 y se convirtió en un símbolo de Guadalajara.',question:'¿En qué año fue inaugurada La Minerva?',answers:['1910','1956','1997'],correct:1,source:'https://transparencia.guadalajara.gob.mx/sites/default/files/GacetaEneroFebrero2021.pdf',x:540,y:415},
 {id:'cabanas',short:'CABAÑAS',name:'Hospicio Cabañas',kind:'Patrimonio mundial',fact:'El Hospicio Cabañas forma parte del Patrimonio Mundial de la UNESCO desde 1997. Su capilla alberga célebres murales de José Clemente Orozco.',question:'¿Qué artista pintó los murales de la capilla?',answers:['José Clemente Orozco','Diego Rivera','Frida Kahlo'],correct:0,source:'https://whc.unesco.org/es/list/815/',x:895,y:315},
 {id:'mariachi',short:'MARIACHI',name:'El mariachi',kind:'Música y tradiciones',fact:'La música de mariachi, con cuerdas, canto y trompeta, fue inscrita por la UNESCO en la lista de Patrimonio Cultural Inmaterial en 2011.',question:'¿Qué año reconoció la UNESCO al mariachi?',answers:['1956','2011','2024'],correct:1,source:'https://ich.unesco.org/es/RL/el-mariachi-musica-decuerdas-canto-y-trompeta-00575',x:285,y:635}
];
const names=['Zuri','Mexo','Kira','Volo','Nima','Teko','Rila','Oru','Luma','Koru','Aki','Vexa'];
const traits=['curioso','ingeniosa','alegre','prudente','artista','estratega','sociable','investigadora','soñadora','protectora'];
const colors=['#63e5cf','#a1a0ff','#ffba70','#ff76ad','#8fd9ff','#c5fb82'];
const initial=()=>({metal:34,data:12,essence:8,subjects:0,pop:6,level:1,engine:1,shield:1,mine:1,defense:1,missions:0,abducted:0,discovered:[],correct:[],people:Array.from({length:6},(_,i)=>({id:i,name:names[i],trait:traits[i],x:505+(i%3)*48,y:536+Math.floor(i/3)*39,age:0})),lastProd:Date.now(),log:['Los primeros habitantes han establecido una colonia en Guadalajara.']});
let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem('kroma_alpha_v20')||'null')||{});}catch(e){state=initial();}
state.people=Array.isArray(state.people)?state.people:initial().people;
function save(){try{localStorage.setItem('kroma_alpha_v20',JSON.stringify(state));}catch(e){}}
let tab='mission', W=0,H=0,dpr=1, last=performance.now(),time=0, tick=0,mission=null, sceneCam={x:600,y:410,z:1}, mapCam={x:625,y:445,z:1},npcs=[],troops=[],shots=[],particles=[],abductionFx=[],messageEnd=0,noticetimer, interactive=[];
let controls={up:false,down:false,left:false,right:false,ray:false}, pointerMap=new Map(),drag=null, raidTime=0,raidStage=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function notice(msg){const el=$('notice');el.textContent=msg;el.classList.add('show');clearTimeout(noticetimer);noticetimer=setTimeout(()=>el.classList.remove('show'),1900);}
function sourceLink(url){return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#75edd8;text-decoration:underline">Ver fuente</a>`}
function pop(html){$('dialogBody').innerHTML=html;$('dialogLayer').classList.remove('hidden');}
function hidePop(){$('dialogLayer').classList.add('hidden');}
function start(){tab='mission';switchTab('mission');pop(`<div class="kicker">BIENVENIDO, REY SUPREMO</div><div class="big">KROMA</div><h2>El imperio comienza en Guadalajara.</h2><p>Controla tu nave, esquiva patrullas y utiliza el rayo tractor para capturar humanos. Sus experiencias permitirán crear nuevos habitantes alienígenas.</p><div class="datum"><span>CONTROLES EN IPHONE</span><b>Flechas + RAYO</b></div><p>También puedes tocar cualquier punto del escenario para mover la nave. Las capturas mejoran tu ciudad; la ciudad fabrica tecnología para tu Rey.</p><button id="beginGame" class="primary">COMENZAR INCURSIÓN</button><button class="secondary" id="visitFirst">VISITAR MI CIUDAD</button><p class="footer-note">Alfa local sin publicidad, compras ni multijugador real. Las ciudades y hechos culturales usan inspiración y datos verificables; la invasión es ficticia.</p>`);$('beginGame').onclick=()=>{hidePop();beginMission();};$('visitFirst').onclick=()=>{hidePop();switchTab('city');};}
function refreshHud(){const vals={resMetal:Math.floor(state.metal),resData:Math.floor(state.data),resEssence:Math.floor(state.essence),resPop:state.pop};for(const k in vals)$(k).textContent=vals[k];if(tab==='mission'){$('viewKind').textContent=mission?'ABDUCCIÓN EN CURSO':'MISIÓN · ACCIÓN EN TIEMPO REAL';$('viewTitle').textContent='GUADALAJARA · LA MINERVA';$('viewSub').textContent=mission?`Abducidos ${mission.captured}/${mission.goal} · Humanos y patrullas en movimiento`:'Pulsa INICIAR INCURSIÓN para salir con tu nave y conseguir recursos.';$('counter').innerHTML=mission?`SALUD <strong>${Math.ceil(mission.hp)}%</strong><br><span style="font-size:11px;color:#9ff5e7">${Math.ceil(mission.clock)} s</span>`:`REY<br><strong>NV. ${state.level}</strong>`;}else if(tab==='city'){$('viewKind').textContent='NUEVA TIERRA · SIMULACIÓN';$('viewTitle').textContent='GUADALAJARA KROMA';$('viewSub').textContent='Arrastra y amplía el mapa. Toca habitantes o lugares para explorarlos.';$('counter').innerHTML=`POBLACIÓN<br><strong>${state.pop}</strong>`;}else if(tab==='king'){$('viewKind').textContent='ARSENAL Y EVOLUCIÓN';$('viewTitle').textContent='REY SUPREMO';$('viewSub').textContent='Los asentamientos fabrican las mejoras de tu nave.';$('counter').innerHTML=`TECNOLOGÍA<br><strong>${state.engine}</strong>`;}else{$('viewKind').textContent='CULTURA GENERAL REAL';$('viewTitle').textContent='ARCHIVO DE LA HUMANIDAD';$('viewSub').textContent='Explora monumentos, conoce su historia y desbloquea recuerdos.';$('counter').innerHTML=`DATOS<br><strong>${state.discovered.length}/3</strong>`;}}
function switchTab(to){tab=to;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('selected',b.dataset.tab===to));$('flightControls').classList.toggle('hidden',to!=='mission'||!mission);$('missionStart').classList.toggle('hidden',to!=='mission'||!!mission);$('cityTools').classList.toggle('hidden',to!=='city');$('archive').classList.toggle('active',to==='archive');$('king').classList.toggle('active',to==='king');if(to==='archive')renderArchive();if(to==='king')renderKing();refreshHud();}
function beginMission(){mission={ship:{x:560,y:515,vx:0,vy:0},hp:100,limit:68,clock:68,goal:7,captured:0,loot:[],score:0,beam:0,emp:0,iframes:0,radar:false,target:{x:560,y:515}};
npcs=Array.from({length:13},(_,i)=>makeHuman(i));npcs[0].x=601;npcs[0].y=505;npcs[0].tx=595;npcs[0].ty=510;npcs[1].x=515;npcs[1].y=466;npcs[1].tx=530;npcs[1].ty=480;troops=Array.from({length:4},(_,i)=>({x:rand(160,1040),y:rand(170,690),cool:rand(1,3),stun:0,phase:rand(0,7)}));shots=[];abductionFx=[];particles=[];sceneCam.x=560;sceneCam.y=440;sceneCam.z=1;$('flightControls').classList.remove('hidden');$('missionStart').classList.add('hidden');notice('¡Invasión iniciada! Captura 7 humanos.');refreshHud();}
function makeHuman(i){return {x:rand(120,1080),y:rand(110,700),tx:rand(150,1040),ty:rand(130,680),job:i%4,phase:rand(0,7),spd:rand(13,27),alive:true};}
function endMission(success){if(!mission)return;const m=mission;mission=null;shots=[];save();$('flightControls').classList.add('hidden');$('missionStart').classList.remove('hidden');const gainData=m.captured*2+(success?6:0),gainEss=m.captured+(success?5:0),gainMetal=Math.floor(m.captured/2)+(success?4:0);state.data+=gainData;state.essence+=gainEss;state.metal+=gainMetal;state.subjects+=m.captured;state.abducted+=m.captured;if(success){state.missions++;if(state.missions%3===0)state.level++;}state.log.unshift(`${success?'Victoria':'Retirada'}: ${m.captured} abducciones, +${gainData} conocimiento.`);save();refreshHud();pop(`<div class="kicker">${success?'MISIÓN COMPLETADA':'MISIÓN TERMINADA'}</div><h2>${success?'La humanidad retrocede.':'El Rey regresó a salvo.'}</h2><p>Has capturado ${m.captured} humanos y transferido sus experiencias al laboratorio de Kroma.</p><div class="datum"><span>Conocimiento</span><b>+${gainData}</b></div><div class="datum"><span>Esencia emocional</span><b>+${gainEss}</b></div><div class="datum"><span>Mineral recuperado</span><b>+${gainMetal}</b></div><div class="datum"><span>Perfiles humanos</span><b>+${m.captured}</b></div><button id="goCity" class="primary">LLEVAR RECURSOS A LA CIUDAD</button><button id="newRun" class="secondary">OTRA INCURSIÓN</button>`);$('goCity').onclick=()=>{hidePop();switchTab('city')};$('newRun').onclick=()=>{hidePop();beginMission()};}
function abduct(){if(!mission)return;const m=mission;if(m.beam>0)return;const radius=78+(state.engine-1)*22,close=npcs.filter(n=>n.alive).map(n=>({...n,d:Math.hypot(n.x-m.ship.x,n.y-m.ship.y)})).sort((a,b)=>a.d-b.d);const target=close[0];m.beam=.55;if(target&&target.d<radius){let n=npcs.find(x=>x.alive&&x.x===target.x&&x.y===target.y);if(n){n.alive=false;m.captured++;m.score+=100;abductionFx.push({x:n.x,y:n.y,life:.8,max:.8});burst(n.x,n.y,'#70eddf',15);notice(['Conocimiento adquirido','Emoción transferida','Perfil civil registrado','Experiencia capturada'][n.job]);if(m.captured===3){discover('minerva',false)}if(m.captured>=m.goal){setTimeout(()=>endMission(true),420);}}}else{notice('Acércate a un humano para abducirlo');}refreshHud();}

for(const t of troops){if(t.stun>0){t.stun-=dt;continue}const d=Math.hypot(t.x-m.ship.x,t.y-m.ship.y);if(d>110&&d<370){t.x+=(m.ship.x-t.x)/d*dt*19;t.y+=(m.ship.y-t.y)/d*dt*19}t.cool-=dt;if(t.cool<=0&&d<430){t.cool=rand(2.3,3.4);shots.push({x:t.x,y:t.y,vx:(m.ship.x-t.x)/Math.max(d,1)*165,vy:(m.ship.y-t.y)/Math.max(d,1)*165,life:3})}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x-m.ship.x,s.y-m.ship.y)<26&&m.iframes<=0){m.hp=Math.max(0,m.hp-(10/state.shield));m.iframes=.6;burst(m.ship.x,m.ship.y,'#ff8c96',8);shots.splice(i,1);refreshHud()}else if(s.life<=0)shots.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}for(let i=abductionFx.length-1;i>=0;i--){abductionFx[i].life-=dt;if(abductionFx[i].life<=0)abductionFx.splice(i,1)}if(m.clock<=0||m.hp<=0){endMission(false)}else if(Math.floor(m.clock)!==Math.floor(m.clock+dt)){refreshHud()}}}
function getCamera(){return tab==='city'?mapCam:sceneCam;}
function transform(){const c=getCamera(),z=(tab==='city'?c.z:Math.max(W/1200,H/800)*1.06);const cx=(tab==='mission'&&mission)?mission.ship.x:c.x,cy=(tab==='mission'&&mission)?mission.ship.y:c.y;return {cx,cy,z,x:W/2-cx*z,y:H/2-cy*z};}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let b=ctx.createRadialGradient(W*.52,H*.4,30,W*.5,H*.5,Math.max(W,H)*.74);b.addColorStop(0,'#1c3e51');b.addColorStop(1,'#060b1a');ctx.fillStyle=b;ctx.fillRect(0,0,W,H);interactive=[];if(tab==='king'||tab==='archive'){ctx.globalAlpha=.17;let tr=transform();ctx.setTransform(dpr*tr.z,0,0,dpr*tr.z,dpr*tr.x,dpr*tr.y);drawCity();ctx.globalAlpha=1;ctx.setTransform(dpr,0,0,dpr,0,0);return;}const t=transform();ctx.setTransform(dpr*t.z,0,0,dpr*t.z,dpr*t.x,dpr*t.y);if(tab==='city')drawCity();else drawMission();ctx.setTransform(dpr,0,0,dpr,0,0);}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame);}
function screenToWorld(x,y){let t=transform();return {x:(x-t.x)/t.z,y:(y-t.y)/t.z}}
function pointerDown(e){if(!$('dialogLayer').classList.contains('hidden'))return; if(tab!=='mission'&&tab!=='city')return;canvas.setPointerCapture(e.pointerId);pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY,ox:e.clientX,oy:e.clientY});drag={x:e.clientX,y:e.clientY,ct:Date.now()};if(tab==='mission'&&mission){const p=screenToWorld(e.offsetX,e.offsetY);mission.target.x=clamp(p.x,70,1130);mission.target.y=clamp(p.y,70,730);}}
function pointerMove(e){if(!pointerMap.has(e.pointerId))return;const prev=pointerMap.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;prev.x=e.clientX;prev.y=e.clientY;pointerMap.set(e.pointerId,prev);if(tab==='city'){if(pointerMap.size===1){mapCam.x-=dx/mapCam.z;mapCam.y-=dy/mapCam.z;mapCam.x=clamp(mapCam.x,140,1060);mapCam.y=clamp(mapCam.y,125,715);}else if(pointerMap.size===2){const pts=[...pointerMap.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),od=Math.hypot((pts[0].x-dx)-pts[1].x,(pts[0].y-dy)-pts[1].y);if(od>3)mapCam.z=clamp(mapCam.z*(dist/od),.55,2.8);}}else if(tab==='mission'&&mission){const p=screenToWorld(e.offsetX,e.offsetY);mission.target.x=clamp(p.x,70,1130);mission.target.y=clamp(p.y,70,730)} }
function pointerUp(e){let d=pointerMap.get(e.pointerId);pointerMap.delete(e.pointerId);if(tab!=='city'||!d)return;if(Math.hypot(d.x-d.ox,d.y-d.oy)>12)return;const r=canvas.getBoundingClientRect(),p=screenToWorld(e.clientX-r.left,e.clientY-r.top);let hit=interactive.filter(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.r).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!hit)return;if(hit.type==='fact')showFact(hit.id);else{const c=state.people[hit.id];if(!c)return;pop(`<button id="closeCit" class="close">Cerrar ×</button><div class="kicker">HABITANTE DE NUEVA TIERRA</div><h2>${c.name}</h2><p>Personalidad: <b>${c.trait}</b>. Le entusiasma explorar su nueva ciudad y contribuir a la civilización alienígena.</p><div class="datum"><span>Oficio</span><b>${['Investigación','Comercio','Arquitectura','Cultura'][c.id%4]}</b></div><div class="datum"><span>Relación con el Rey</span><b>Leal</b></div><p class="footer-note">En esta alfa los habitantes tienen rutinas sencillas. Las relaciones profundas, familias y diálogo IA son funciones futuras.</p>`);$('closeCit').onclick=hidePop;}}
function setup(){window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);canvas.addEventListener('pointerdown',pointerDown,{passive:false});canvas.addEventListener('pointermove',pointerMove,{passive:false});canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',e=>pointerMap.delete(e.pointerId));canvas.addEventListener('wheel',e=>{if(tab==='city'){e.preventDefault();mapCam.z=clamp(mapCam.z*(e.deltaY>0?.90:1.1),.55,2.8)}},{passive:false});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));const dirs={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};for(const b of document.querySelectorAll('[data-dir]')){let d=b.dataset.dir;const release=e=>{if(e)e.preventDefault();controls[d]=false;b.classList.remove('on')};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);controls[d]=true;b.classList.add('on')});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();return;}let dir=Object.keys(dirs).find(k=>dirs[k]===e.key);if(dir){e.preventDefault();controls[dir]=true;}if(e.code==='Space'){e.preventDefault();abduct()}});window.addEventListener('keyup',e=>{let dir=Object.keys(dirs).find(k=>dirs[k]===e.key);if(dir)controls[dir]=false});$('rayBtn').onclick=abduct;$('empBtn').onclick=emp;$('launchBtn').onclick=beginMission;
$('zin').onclick=()=>{mapCam.z=clamp(mapCam.z*1.3,.55,2.8)};$('zout').onclick=()=>{mapCam.z=clamp(mapCam.z/1.3,.55,2.8)};$('growBtn').onclick=addCitizen;$('mineBtn').onclick=upgradeMine;$('defBtn').onclick=upgradeDefense;$('raidBtn').onclick=raid;
$('dialogLayer').addEventListener('click',e=>{if(e.target===$('dialogLayer'))hidePop()});integrateProduction();setInterval(()=>{if(tab==='mission'&&!mission&&$('dialogLayer').classList.contains('hidden')){refreshHud()}},1000);start();}
setup();
})();
